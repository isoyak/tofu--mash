<style>
  :root{
    --cream:#F3EEE3;
    --paper:#FBF8F1;
    --ink:#17140F;
    --ink-soft:#39352C;
    --red:#B8352A;
    --red-deep:#7E241C;
    --line:#D9D0BC;
    --muted:#8A8272;
    --radius:2px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  #app{
    position:fixed;inset:0;
    height:100dvh;
    display:flex;flex-direction:column;
    padding-top:calc(var(--safe-t) + 14px);
    padding-bottom:calc(var(--safe-b) + 14px);
  }
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    min-height:0;
    padding:0 18px;
  }
  .screen.active{display:flex;}

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;background:var(--red);border-radius:50%;flex:none;}
  .hairline{border:none;border-top:1px dashed var(--line);margin:14px 0;}

  /* ---------- intro ---------- */
  #screen-intro{justify-content:space-between;padding-top:8px;}
  .intro-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--ink-soft);}
  .intro-mid{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .title{
    font-weight:700;
    font-size:15vw;
    line-height:.86;
    letter-spacing:-0.02em;
    margin:0;
  }
  .title span{display:block;}
  .title .accent{color:var(--red);}
  .subcopy{
    margin-top:18px;
    font-size:16px;
    color:var(--ink-soft);
    max-width:30ch;
    line-height:1.45;
  }
  .intro-preview{
    margin-top:22px;
    display:flex;gap:10px;align-items:center;
  }
  .preview-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .preview-vs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .intro-bottom{padding-bottom:6px;}
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.01em;
    border:none;
    width:100%;
    padding:19px 20px;
    background:var(--ink);
    color:var(--paper);
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
    border-radius:var(--radius);
    min-height:56px;
  }
  .btn:active{transform:scale(.985);}
  .btn .arrow{font-family:'IBM Plex Mono',monospace;}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
    margin-top:10px;
  }
  .btn.ghost{
    background:transparent;color:var(--ink-soft);border:1px dashed var(--line);
    font-size:14px;padding:14px 16px;
  }
  .mode-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.1em;color:var(--muted);
    margin-top:10px;text-align:center;
  }

  /* ---------- game ---------- */
  #screen-game{padding-top:2px;}
  .progress-wrap{height:3px;background:var(--line);width:100%;flex:none;}
  .progress-bar{height:100%;background:var(--red);width:0%;transition:width .28s ease;}
  .game-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0 6px;
    flex:none;
  }
  .prompt{
    font-size:12px;letter-spacing:.1em;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;
  }
  .round-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .battle{
    flex:1;
    display:flex;flex-direction:column;
    gap:10px;
    min-height:0;
    padding-bottom:6px;
  }
  .card{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
    position:relative;
    cursor:pointer;
    padding:10px;
    min-height:0;
    -webkit-user-select:none;user-select:none;
    transition:transform .12s ease, background .12s ease;
  }
  .card:active{transform:scale(.98);background:#F2ECDD;}
  .card .emoji{font-size:min(15vw,74px);line-height:1;filter:grayscale(0);}
  .card .name{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;letter-spacing:.02em;
    text-align:center;
    color:var(--ink);
    max-width:80%;
  }
  .card.winner{background:var(--ink);}
  .card.winner .name{color:var(--paper);}
  .card.winner .emoji{transform:scale(1.08);}
  .card.loser{opacity:.28;}
  .vs-divider{
    flex:none;
    align-self:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--red);
    padding:5px 10px;
    letter-spacing:.08em;
    transform:rotate(-3deg);
    z-index:2;
    margin:-4px 0;
  }

  /* ---------- result ---------- */
  #screen-result{align-items:stretch;padding-top:2px;overflow-y:auto;}
  .receipt-wrap{
    flex:1;
    display:flex;flex-direction:column;
    padding:10px 0 4px;
  }
  #resultCanvas{
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:block;
    aspect-ratio:4/5;
    border:1px solid var(--line);
  }
  .result-actions{margin-top:16px;}
  .share-row{display:flex;gap:8px;}
  .share-row .btn{flex:1;}
  .result-meta{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--muted);
    text-align:center;
    line-height:1.6;
  }

  /* ---------- ultimate reveal ---------- */
  #revealOverlay{
    position:fixed;inset:0;z-index:500;
    display:none;align-items:center;justify-content:center;flex-direction:column;
    background:var(--ink);color:var(--paper);text-align:center;padding:20px;
    opacity:0;transition:opacity .35s ease;
  }
  #revealOverlay.show{display:flex;opacity:1;}
  #revealOverlay .line1{
    font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.16em;
    color:#D9846F;margin-bottom:12px;text-transform:uppercase;
  }
  #revealOverlay .line2{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14vw;line-height:1;
  }

  /* ---------- debug ---------- */
  #debugPanel{
    position:fixed;left:8px;bottom:8px;
    max-width:280px;max-height:40vh;overflow:auto;
    background:rgba(23,20,15,.92);color:#D9D0BC;
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    padding:8px;z-index:999;display:none;line-height:1.5;
    border-radius:2px;
  }

  /* ---------- accessibility / motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
  button:focus-visible, .card:focus-visible{
    outline:2px solid var(--red);outline-offset:2px;
  }
  @media (min-width:480px){
    .title{font-size:64px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= INTRO ================= -->
  <section id="screen-intro" class="screen active">
    <div class="intro-top">
      <div class="brand">TOFU NIPPON</div>
      <div class="eyebrow"><span class="dot"></span>TOFU MASH</div>
    </div>
    <div class="intro-mid">

  <!-- ================= RESULT ================= -->

    <div class="receipt-wrap">
      <canvas id="resultCanvas" width="1080" height="1350"></canvas>
      <div class="result-actions">

        <button class="btn ghost" id="copyBtn">copy result text</button>
      </div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </section>

</div>
<div id="revealOverlay" aria-live="polite"></div>
<div id="debugPanel"></div>

<script>
(function(){
"use strict";

/* single place to update if/when the real domain differs from this placeholder */
var CONFIG = { shareUrl: "https://tofunippon.com/tofumash", twitterHandle: "@TofuNippon" };

/* =========================================================
   0. ANALYTICS STUB
   ========================================================= */
window.__tofuEvents = [];
function track(name, data){
  var entry = {t:Date.now(), name:name, data:data||{}};
  window.__tofuEvents.push(entry);
  console.log("[tofu-mash]", name, data||{});
  renderDebug();
}

/* =========================================================
   1. CANDIDATE POOL + CATEGORY VECTORS
   axes: [softness, chaos, classic, absurdity, purity, unbothered, experimental]
   ========================================================= */
var VEC = {
  REAL_SOFT:        [2,0,2,0,1,1,0],
  REAL_FIRM:        [1,1,2,0,1,0,0],
  SOY_ADJ:          [1,0,1,0,1,1,1],
  SOFT_OBJ:         [2,0,0,1,0,1,1],
  HARD_OBJ:         [0,1,0,1,0,0,0],
  TEXTURE_CONFUSE:  [1,1,0,1,0,0,1],
  INTERNET_CHAOS:   [0,2,0,2,0,0,2],
  CALM_ABSURD:      [1,0,0,1,0,2,1]
};
/* empirical mean/std per axis under uniform-random 12-round play (400k-run Monte Carlo).
   used to classify in z-score space instead of raw 0-100 — this is the fix for the
   "8 of 12 types unreachable" bug: raw-space targets clustered near the CLT mean of
   random play, so only the types nearest that mean were ever selected. */
var AXIS_MEAN=[12.00,7.50,7.50,9.00,4.50,7.50,9.01];
var AXIS_STD =[2.45,2.41,2.97,2.29,1.68,2.41,2.29];

function item(name, emoji, cat){ return {name:name, emoji:emoji, cat:cat}; }

var I = {
  silken:   item("Silken Tofu","🤍","REAL_SOFT"),
  kinugoshi:item("Kinugoshi Tofu","⬜","REAL_SOFT"),
  hiyayakko:item("Hiyayakko","🥢","REAL_SOFT"),
  eggtofu:  item("Egg Tofu","🥚","REAL_SOFT"),
  firm:     item("Firm Tofu","🔲","REAL_FIRM"),
  mapo:     item("Mapo Tofu","🌶️","REAL_FIRM"),
  agedashi: item("Agedashi Tofu","🍢","REAL_FIRM"),
  aburaage: item("Aburaage","🟧","REAL_FIRM"),
  yuba:     item("Yuba","🍜","SOY_ADJ"),
  okara:    item("Okara","🌾","SOY_ADJ"),
  soymilk:  item("Soy Milk","🥛","SOY_ADJ"),
  cloud:    item("Cloud","☁️","SOFT_OBJ"),
  pillow:   item("Pillow","🛏️","SOFT_OBJ"),
  marshmallow:item("Marshmallow","🍡","SOFT_OBJ"),
  jelly:    item("Jelly","🍮","SOFT_OBJ"),
  pannacotta:item("Panna Cotta","🍨","SOFT_OBJ"),
  memoryfoam:item("Memory Foam","🛌","SOFT_OBJ"),
  cottonball:item("Cotton Ball","🌫️","SOFT_OBJ"),
  mochi:    item("Mochi","⚪","SOFT_OBJ"),
  cottoncandy:item("Cotton Candy","🍬","SOFT_OBJ"),
  feather:  item("Feather","🪶","SOFT_OBJ"),
  balloon:  item("Balloon","🎈","SOFT_OBJ"),
  waterballoon:item("Water Balloon","💧","SOFT_OBJ"),
  bubblewrap:item("Bubble Wrap","💭","SOFT_OBJ"),
  gummybear:item("Gummy Bear","🐻","SOFT_OBJ"),
  bathbomb: item("Bath Bomb","🛁","SOFT_OBJ"),
  rubberduck:item("Rubber Duck","🦆","SOFT_OBJ"),
  icecream: item("Ice Cream","🍦","SOFT_OBJ"),
  custard:  item("Custard","🥣","SOFT_OBJ"),
  rock:     item("Rock","🪨","HARD_OBJ"),
  concrete: item("Concrete","🧱","HARD_OBJ"),
  ice:      item("Ice","🧊","HARD_OBJ"),
  brick:    item("Brick","🟥","HARD_OBJ"),
  cinderblock:item("Cinder Block","⬛","HARD_OBJ"),
  stone:    item("Stone","🗿","HARD_OBJ"),
  screenprotector:item("Screen Protector","📱","HARD_OBJ"),
  styrofoam:item("Styrofoam","📦","HARD_OBJ"),
  sponge:   item("Sponge","🧽","TEXTURE_CONFUSE"),
  cheese:   item("Cheese","🧀","TEXTURE_CONFUSE"),
  paper:    item("Paper","📄","TEXTURE_CONFUSE"),
  soap:     item("Soap","🧼","TEXTURE_CONFUSE"),
  fishcake: item("Fish Cake","🍥","TEXTURE_CONFUSE"),
  wetwipe:  item("Wet Wipe","🧻","TEXTURE_CONFUSE"),
  wifisignal:item("Wifi Signal","📶","INTERNET_CHAOS"),
  vibe:     item("The Vibe","✨","CALM_ABSURD"),
  groupchat:item("Group Chat","💬","INTERNET_CHAOS"),
  cursedmeme:item("Cursed Meme","🫠","INTERNET_CHAOS"),
  sundayscaries:item("Sunday Scaries","😮‍💨","INTERNET_CHAOS"),
  nostalgia:item("Nostalgia","📼","CALM_ABSURD"),
  silence:  item("Silence","🤐","CALM_ABSURD"),
  wifipassword:item("Wifi Password","🔐","INTERNET_CHAOS"),
  tofu:     item("Tofu","◻️","REAL_SOFT"),
  monday:   item("Monday","📅","INTERNET_CHAOS"),
  yourex:   item("Your Ex","💔","INTERNET_CHAOS"),
  nothing:  item("Nothing","🌀","INTERNET_CHAOS")
};

/* curated pairs — hand-picked for tension, not random pairing */
var PAIRS = [
  [I.silken, I.pannacotta],[I.hiyayakko, I.jelly],[I.yuba, I.paper],
  [I.firm, I.soap],[I.kinugoshi, I.custard],[I.mapo, I.cursedmeme],
  [I.agedashi, I.fishcake],[I.aburaage, I.cheese],[I.eggtofu, I.waterballoon],
  [I.okara, I.sundayscaries],[I.soymilk, I.wifisignal],[I.cloud, I.rock],
  [I.pillow, I.cinderblock],[I.marshmallow, I.ice],[I.sponge, I.silken],
  [I.memoryfoam, I.firm],[I.cottonball, I.concrete],[I.mochi, I.stone],
  [I.cottoncandy, I.brick],[I.feather, I.screenprotector],[I.balloon, I.styrofoam],
  [I.bubblewrap, I.kinugoshi],[I.gummybear, I.hiyayakko],[I.bathbomb, I.vibe],
  [I.rubberduck, I.groupchat],[I.icecream, I.nostalgia],[I.wifipassword, I.silence],
  [I.cheese, I.cloud],[I.wetwipe, I.yuba],[I.paper, I.marshmallow],
  [I.soap, I.bubblewrap],[I.fishcake, I.mochi],[I.rock, I.cursedmeme],
  [I.concrete, I.sundayscaries],[I.ice, I.vibe],[I.brick, I.silken],
  [I.stone, I.eggtofu],[I.cinderblock, I.cottoncandy],[I.styrofoam, I.pillow],
  [I.screenprotector, I.jelly],[I.custard, I.aburaage],[I.nostalgia, I.agedashi],
  [I.groupchat, I.mapo],[I.silence, I.cloud],[I.vibe, I.okara],
  [I.tofu, I.cloud],[I.tofu, I.silence],[I.tofu, I.nostalgia],
  [I.tofu, I.wifisignal],[I.tofu, I.monday],[I.tofu, I.yourex],[I.tofu, I.nothing]
];

/* =========================================================
   2. RESULT TYPES — target profile per axis, 0-100 scale
   axes: [softness, chaos, classic, absurdity, purity, unbothered, experimental]
   ========================================================= */
/* Rarity-controlled result table.
   Classification is no longer "pure nearest neighbor in z-space" (which produced an
   uncontrolled ~50/30/12/6/2% skew toward 3-4 types). Each type now carries an explicit
   `weight` used as affinity = weight / (distance + 0.15); argmax affinity wins. Weights
   were solved via 35-round iterative proportional fitting against target tiers and verified
   with a 500k-run Monte Carlo (see design notes) — every type lands within ~0.3pt of its
   target, and the tiers sum to 100%:
     common ~57% (softcore/unbothered/crispy/pure) · uncommon ~30% (feral/chaotic/cosmic/forbidden)
     rare ~12% (silent/sad/emotional) · legendary ~0.3% (ultimate) */
var TYPES = [
  {id:"silent",   name:"SILENT TOFU",     tag:"soft. quiet. unbothered.",        tier:"rare",      weight:1.065, z:[ 1.5,-1.3, 1.4,-1.1, 1.4, 1.4,-1.1], stamp:"STILL TOFU."},
  {id:"softcore", name:"SOFTCORE TOFU",   tag:"gentle by choice.",               tier:"common",    weight:1.136, z:[ 1.2, 0.2, 0.0, 0.2, 0.0, 0.2, 0.2], stamp:"TOFU FOUND."},
  {id:"feral",    name:"FERAL TOFU",      tag:"soft outside. chaos inside.",     tier:"uncommon",  weight:1.495, z:[ 1.3, 1.5,-0.7, 0.4,-0.7,-0.6, 0.3], stamp:"NO REFUNDS."},
  {id:"chaotic",  name:"CHAOTIC TOFU",    tag:"no plate can hold this.",         tier:"uncommon",  weight:0.747, z:[-0.2, 1.8,-0.7, 0.5,-0.4,-0.7, 0.0], stamp:"CONFIRMED."},
  {id:"unbothered",name:"UNBOTHERED TOFU",tag:"still tofu. still calm.",         tier:"common",    weight:1.090, z:[ 0.2,-1.1, 0.2,-0.4, 0.0, 1.7,-0.3], stamp:"TOFU FOUND."},
  {id:"sad",      name:"SAD TOFU",        tag:"soft doesn't mean okay.",         tier:"rare",      weight:0.993, z:[ 1.0,-0.2,-0.5,-0.3,-0.5,-1.3,-0.3], stamp:"IT'S OKAY."},
  {id:"cosmic",   name:"COSMIC TOFU",     tag:"beyond the fridge.",              tier:"uncommon",  weight:0.812, z:[-0.4, 0.7,-0.9, 1.4,-0.6, 0.4, 1.7], stamp:"TOFU, ELSEWHERE."},
  {id:"crispy",   name:"CRISPY TOFU",     tag:"same tofu. new confidence.",      tier:"common",    weight:1.068, z:[-1.1, 0.5, 1.5,-0.3, 0.5,-0.2,-0.4], stamp:"TOFU FOUND."},
  {id:"forbidden",name:"FORBIDDEN TOFU",  tag:"the internet warned you.",        tier:"uncommon",  weight:0.818, z:[-1.0, 0.8,-1.5, 0.9,-1.2, 0.1, 1.9], stamp:"YOU WERE WARNED."},
  {id:"emotional",name:"EMOTIONAL TOFU",  tag:"cries in the fridge sometimes.",  tier:"rare",      weight:0.929, z:[ 1.1,-0.3, 0.0,-0.6, 1.3,-0.2,-0.2], stamp:"STILL TOFU."},
  {id:"pure",     name:"PURE TOFU",       tag:"unseasoned. undefeated.",         tier:"common",    weight:1.448, z:[ 0.3,-1.4, 1.3,-1.3, 1.7, 0.9,-0.9], stamp:"UNSEASONED. CONFIRMED."},
  {id:"ultimate", name:"ULTIMATE TOFU",   tag:"the last cube in the pack.",      tier:"legendary", weight:29.369,z:[ 1.0, 1.0, 0.8, 0.8, 0.8, 0.8, 1.0], stamp:"YOU HAVE BECOME TOFU."}
];

/* =========================================================
   3. SEEDED RNG
   ========================================================= */
function hashStr(s){ var h=1779033703^s.length;
  for(var i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return h>>>0; };
}
function mulberry32(a){
  return function(){ a|=0;a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function seededShuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* =========================================================
   4. GAME STATE
   ========================================================= */
var DEBUG = new URLSearchParams(location.search).get("debug")==="1";
document.getElementById("debugPanel").style.display = DEBUG ? "block":"none";

var state = { mode:"daily", rounds:[], round:0, scores:[0,0,0,0,0,0,0], busy:false, rng:null, picks:[] };

function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){ /* private browsing / storage disabled: fail silently */ } }

function playedTodayAlready(){
  return safeGet("tofumash_daily_date") === todayStr();
}

function setupIntro(){
  var isRemix = playedTodayAlready();
  state.mode = isRemix ? "remix" : "daily";
  document.getElementById("startLabel").textContent = isRemix ? "REMIX ME" : "MASH ME";
  document.getElementById("modeTag").textContent = isRemix
    ? "remix mash · a new combination, just for you"
    : "today's mash · same for everyone, today only";
}
setupIntro();

/* =========================================================
   5. SCREEN SWITCHING
   ========================================================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

/* =========================================================
   6. GAME START / ROUND LOOP
   ========================================================= */
document.getElementById("startBtn").addEventListener("click", function(){
  var seedSrc = state.mode==="daily" ? ("tofu-"+todayStr()) : ("remix-"+Date.now()+"-"+Math.random());
  var seedFn = hashStr(seedSrc);
  var rng = mulberry32(seedFn());
  state.rng = rng;
  state.rounds = seededShuffle(PAIRS, rng).slice(0,12);
  state.round = 0;
  state.scores = [0,0,0,0,0,0,0];
  state.picks = [];
  track(state.mode==="daily"?"daily_start":"remix_start", {seed:seedSrc});
  track("game_start", {mode:state.mode});
  showScreen("screen-game");
  renderRound();
});

function renderRound(){
  var pair = state.rounds[state.round];
  // deterministic left/right so a daily game is byte-identical for everyone that day
  var flip = state.rng() < 0.5;
  var a = flip ? pair[1] : pair[0];
  var b = flip ? pair[0] : pair[1];

  var elA = document.getElementById("cardA");
  var elB = document.getElementById("cardB");
  elA.innerHTML = '<div class="emoji" aria-hidden="true">'+a.emoji+'</div><div class="name">'+a.name.toUpperCase()+'</div>';
  elB.innerHTML = '<div class="emoji" aria-hidden="true">'+b.emoji+'</div><div class="name">'+b.name.toUpperCase()+'</div>';
  elA.setAttribute("aria-label","Choose "+a.name);
  elB.setAttribute("aria-label","Choose "+b.name);
  elA.className="card"; elB.className="card";
  elA.dataset.cat=a.cat; elB.dataset.cat=b.cat;
  elA._item=a; elB._item=b;

  document.getElementById("roundCount").textContent = (state.round+1)+"/12";
  document.getElementById("progressBar").style.width = ((state.round)/12*100)+"%";
  state.busy = false;
}

function handlePick(chosenEl, otherEl){
  if(state.busy) return;
  state.busy = true;
  var cat = chosenEl.dataset.cat;
  var vec = VEC[cat];
  for(var i=0;i<7;i++) state.scores[i]+=vec[i];
  if(chosenEl._item) state.picks.push(chosenEl._item);

  chosenEl.classList.add("winner");
  otherEl.classList.add("loser");
  track("choice", {round:state.round+1, cat:cat});

  var delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 320;
  setTimeout(function(){
    state.round++;
    document.getElementById("progressBar").style.width = (state.round/12*100)+"%";
    track("round_complete", {round:state.round});
    if(state.round >= 12){
      finishGame();
    } else {
      renderRound();
    }
  }, delay);
}
document.getElementById("cardA").addEventListener("click", function(){
  handlePick(document.getElementById("cardA"), document.getElementById("cardB"));
});
document.getElementById("cardB").addEventListener("click", function(){
  handlePick(document.getElementById("cardB"), document.getElementById("cardA"));
});

/* =========================================================
   7. SCORING -> RESULT TYPE
   ========================================================= */
function computeResult(){
  var z = state.scores.map(function(v,i){ return (v-AXIS_MEAN[i])/AXIS_STD[i]; });
  var avg = z.reduce(function(a,b){return a+b;},0)/7;
  var min = Math.min.apply(null, z);
  var ultimateEligible = avg>0.5 && min>-0.3;
  var pool = TYPES.filter(function(t){ return t.id!=="ultimate" || ultimateEligible; });
  var best=null, bestAff=-Infinity;
  pool.forEach(function(t){
    var d=0;
    for(var i=0;i<7;i++){ var diff=t.z[i]-z[i]; d+=diff*diff; }
    var aff = t.weight / (d + 0.15);
    if(aff>bestAff){ bestAff=aff; best=t; }
  });
  // 0-100 display meters for the result card (visual only — not used for classification)
  var display = z.map(function(v){ return Math.max(0, Math.min(100, Math.round(50+v*20))); });
  return {type:best, z:z, display:display};
}

/* =========================================================
   8. RESULT RENDER (canvas receipt card)
   ========================================================= */
var lastResult = null;

function finishGame(){
  track("game_complete", {scores:state.scores});
  if(state.mode==="daily"){ safeSet("tofumash_daily_date", todayStr()); }
  lastResult = computeResult();
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(lastResult.type.id==="ultimate" && !reduced){
    var ov=document.getElementById("revealOverlay");
    ov.innerHTML='<div class="line1">YOU HAVE BECOME</div><div class="line2">TOFU.</div>';
    ov.classList.add("show");
    track("ultimate_reveal", {});
    setTimeout(function(){ ov.classList.remove("show"); completeResult(); }, 1500);
  } else {
    completeResult();
  }
}

function completeResult(){
  drawCard(lastResult);
  var meta = document.getElementById("resultMeta");
  var tierLabel = (lastResult.type.tier==="rare"||lastResult.type.tier==="legendary")
    ? " · " + lastResult.type.tier.toUpperCase() : "";
  meta.textContent = "12 PICKS · " + (state.mode==="daily"?"DAILY MASH":"REMIX MASH") + tierLabel + " · " + todayStr();
  showScreen("screen-result");
  track("result_view", {type:lastResult.type.id, tier:lastResult.type.tier});
  setupIntro(); // update button label for next visit to intro
}

function drawCard(result){
  var c = document.getElementById("resultCanvas");
  var ctx = c.getContext("2d");
  var W=c.width, H=c.height;

  ctx.fillStyle="#FBF8F1"; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#D9D0BC"; ctx.lineWidth=3; ctx.setLineDash([10,10]);
  ctx.strokeRect(28,28,W-56,H-56);
  ctx.setLineDash([]);

  function dashedLine(y){
    ctx.strokeStyle="#D9D0BC"; ctx.lineWidth=2; ctx.setLineDash([6,10]);
    ctx.beginPath(); ctx.moveTo(64,y); ctx.lineTo(W-64,y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // header
  ctx.fillStyle="#8A8272";
  ctx.font="600 24px 'IBM Plex Mono', monospace";
  ctx.textAlign="left";
  ctx.fillText("TOFU NIPPON", 64, 96);
  ctx.textAlign="right";
  var hasBadge = (result.type.tier==="rare" || result.type.tier==="legendary");
  if(hasBadge){
    var badgeText = result.type.tier==="legendary" ? "★ LEGENDARY PULL" : "★ RARE";
    ctx.fillStyle="#B8352A";
    ctx.font="600 20px 'IBM Plex Mono', monospace";
    ctx.textAlign="center";
    ctx.fillText(badgeText, W/2, 60);
  }

  ctx.fillStyle="#8A8272";
  ctx.font="600 24px 'IBM Plex Mono', monospace";
  ctx.textAlign="right";
  ctx.fillText(todayStr(), W-64, 96);
  dashedLine(126);

  // eyebrow + type name + tagline
  ctx.fillStyle="#B8352A";
  ctx.font="600 28px 'IBM Plex Mono', monospace";
  ctx.textAlign="center";
  ctx.fillText(state.mode==="daily" ? "TODAY'S TOFU" : "YOUR TOFU TYPE", W/2, 186);

  ctx.fillStyle="#17140F";
  ctx.font="700 78px 'Space Grotesk', sans-serif";
  wrapCenter(ctx, result.type.name, W/2, 300, W-140, 86);

  ctx.font="italic 500 30px 'Space Grotesk', sans-serif";
  ctx.fillStyle="#39352C";
  wrapCenter(ctx, result.type.tag, W/2, 470, W-220, 40);

  dashedLine(520);

  // 12-pick grid — a record of the actual session, not just abstract stats
  ctx.fillStyle="#8A8272";
  ctx.font="500 20px 'IBM Plex Mono', monospace";
  ctx.textAlign="left";
  ctx.fillText("YOUR 12 PICKS", 64, 558);

  var picks = state.picks && state.picks.length===12 ? state.picks : null;
  var gridTop=580, cols=4, rows=3, cellW=(W-128)/cols, cellH=110;
  if(picks){
    for(var i=0;i<12;i++){
      var col=i%cols, row=Math.floor(i/cols);
      var cx=64+cellW*col+cellW/2, cy=gridTop+cellH*row+cellH/2;
      ctx.textAlign="center";
      ctx.font="46px sans-serif";
      ctx.fillText(picks[i].emoji, cx, cy+16);
    }
  }
  dashedLine(gridTop+cellH*rows+30);

  // axis meters (display-only 0-100 meters derived from z-scores)
  var axes=["SOFT","CHAOS","CLASSIC","ABSURD","PURE","CALM","WEIRD"];
  ctx.font="500 21px 'IBM Plex Mono', monospace";
  ctx.textAlign="left";
  var barTop=gridTop+cellH*rows+60, rowH=32, barX=64, barW=W-128;
  axes.forEach(function(label,i){
    var y=barTop+i*rowH;
    ctx.fillStyle="#8A8272";
    ctx.fillText(label, barX, y+15);
    var bx=barX+150, bw=barW-150;
    ctx.fillStyle="#EFE8D8"; ctx.fillRect(bx,y,bw,13);
    ctx.fillStyle="#B8352A"; ctx.fillRect(bx,y,bw*(result.display[i]/100),13);
  });

  var footerLineY = barTop + axes.length*rowH + 24;
  dashedLine(footerLineY);

  // stamp / brand / url — three clearly separated lines, never overlapping the meters above
  ctx.fillStyle="#8A8272";
  ctx.font="500 21px 'IBM Plex Mono', monospace";
  ctx.textAlign="center";
  ctx.fillText(result.type.stamp, W/2, footerLineY+38);
  ctx.fillStyle="#17140F";
  ctx.font="600 25px 'IBM Plex Mono', monospace";
  ctx.fillText("TOFU MASH", W/2, footerLineY+72);
  ctx.fillStyle="#8A8272";
  ctx.font="500 18px 'IBM Plex Mono', monospace";
  ctx.fillText(CONFIG.shareUrl.replace("https://",""), W/2, footerLineY+100);
}

function wrapCenter(ctx, text, cx, y, maxW, lineH){
  var words=text.split(" "), lines=[], cur="";
  words.forEach(function(w){
    var test=cur?cur+" "+w:w;
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else { cur=test; }
  });
  if(cur) lines.push(cur);
  var startY = y - (lines.length-1)*lineH/2;
  lines.forEach(function(line,i){ ctx.fillText(line, cx, startY+i*lineH); });
}

/* =========================================================
   9. SHARE / SAVE / REPLAY
   ========================================================= */
function shareText(){
  var t=lastResult.type;
  var url=CONFIG.shareUrl;
  if(state.mode==="daily"){
    return "today's tofu:\n"+t.name+"\n\n"+t.tag+"\n\nwhat are you? "+CONFIG.twitterHandle+"\n\nTOFU MASH ↓\n"+url;
  }
  return "I got "+t.name+".\n\n"+t.tag+"\n\napparently this is who I am.\n\nwhat are you? "+CONFIG.twitterHandle+"\n\nTOFU MASH ↓\n"+url;
}

document.getElementById("shareBtn").addEventListener("click", function(){
  track("share_click", {type:lastResult.type.id});
  var url = "https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText());
  window.open(url, "_blank", "noopener");
});

function canvasToBlob(){
  return new Promise(function(resolve){
    document.getElementById("resultCanvas").toBlob(function(blob){ resolve(blob); }, "image/png");
  });
}

function downloadCanvasFallback(){
  // toDataURL + <a download> doesn't work on iOS Safari — this path is for browsers
  // that support it but not the Web Share API (mostly desktop).
  var link=document.createElement("a");
  link.download="tofu-mash-"+lastResult.type.id+".png";
  link.href=document.getElementById("resultCanvas").toDataURL("image/png");
  link.click();
}

document.getElementById("saveBtn").addEventListener("click", function(){
  track("share_download", {type:lastResult.type.id});
  canvasToBlob().then(function(blob){
    if(!blob) return downloadCanvasFallback();
    var file = new File([blob], "tofu-mash-"+lastResult.type.id+".png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      // iOS/Android: opens the native share sheet, image attached, X app included if installed
      navigator.share({files:[file], title:"TOFU MASH", text:shareText()}).catch(function(){});
    } else {
      downloadCanvasFallback();
    }
  });
});

document.getElementById("copyBtn").addEventListener("click", function(){
  track("result_copy", {type:lastResult.type.id});
  navigator.clipboard && navigator.clipboard.writeText(shareText()).catch(function(){});
  var btn=document.getElementById("copyBtn");
  var old=btn.textContent; btn.textContent="copied.";
  setTimeout(function(){ btn.textContent=old; }, 1200);
});

document.getElementById("replayBtn").addEventListener("click", function(){
  track("replay", {nextMode: playedTodayAlready()?"remix":"daily"});
  setupIntro();
  showScreen("screen-intro");
});

/* =========================================================
   10. KEYBOARD SUPPORT (arrow keys during battle)
   ========================================================= */
document.addEventListener("keydown", function(e){
  if(!document.getElementById("screen-game").classList.contains("active")) return;
  if(e.key==="ArrowLeft" || e.key==="1"){ document.getElementById("cardA").click(); }
  if(e.key==="ArrowRight" || e.key==="2"){ document.getElementById("cardB").click(); }
});

/* =========================================================
   11. DEBUG OVERLAY
   ========================================================= */
function renderDebug(){
  if(!DEBUG) return;
  var p=document.getElementById("debugPanel");
  var z = state.scores.map(function(v,i){ return ((v-AXIS_MEAN[i])/AXIS_STD[i]).toFixed(2); });
  var log = window.__tofuEvents.slice(-8).map(function(e){ return e.name+" "+JSON.stringify(e.data); }).join("<br>");
  p.innerHTML = "<b>round:</b> "+state.round+"/12<br>"+
    "<b>scores:</b> "+state.scores.join(",")+"<br>"+
    "<b>z:</b> "+z.join(",")+"<br>"+
    "<b>type:</b> "+(lastResult?lastResult.type.id+" ("+lastResult.type.tier+", w="+lastResult.type.weight+")":"-")+"<br>"+
    "<hr style='border-color:#444'>"+log;
}
renderDebug();

})();
</script>
