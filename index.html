<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>TOFU MASH — what kind of tofu are you?</title>
<meta name="description" content="12 instinct picks. one tofu personality. TOFU MASH by TOFU NIPPON.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3EEE3;
    --paper:#FBF8F1;
    --ink:#17140F;
    --ink-soft:#39352C;
    --red:#B8352A;
    --red-deep:#7E241C;
    --line:#D9D0BC;
    --muted:#8A8272;
    --radius:2px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Grotesk',system-ui,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  #app{
    position:fixed;inset:0;
    height:100dvh;
    display:flex;flex-direction:column;
    padding-top:calc(var(--safe-t) + 14px);
    padding-bottom:calc(var(--safe-b) + 14px);
  }
  .screen{
    display:none;
    flex:1;
    flex-direction:column;
    min-height:0;
    padding:0 18px;
  }
  .screen.active{display:flex;}

  /* ---------- shared bits ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--muted);
    text-transform:uppercase;
    display:flex;align-items:center;gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;background:var(--red);border-radius:50%;flex:none;}
  .hairline{border:none;border-top:1px dashed var(--line);margin:14px 0;}

  /* ---------- intro ---------- */
  #screen-intro{justify-content:space-between;padding-top:8px;}
  .intro-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .brand{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:var(--ink-soft);}
  .intro-mid{flex:1;display:flex;flex-direction:column;justify-content:center;}
  .title{
    font-weight:700;
    font-size:15vw;
    line-height:.86;
    letter-spacing:-0.02em;
    margin:0;
  }
  .title span{display:block;}
  .title .accent{color:var(--red);}
  .subcopy{
    margin-top:18px;
    font-size:16px;
    color:var(--ink-soft);
    max-width:30ch;
    line-height:1.45;
  }
  .intro-preview{
    margin-top:22px;
    display:flex;gap:10px;align-items:center;
  }
  .preview-chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:20px;
    width:44px;height:44px;
    display:flex;align-items:center;justify-content:center;
    background:var(--paper);
    border:1px solid var(--line);
  }
  .preview-vs{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  .intro-bottom{padding-bottom:6px;}
  .btn{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.01em;
    border:none;
    width:100%;
    padding:19px 20px;
    background:var(--ink);
    color:var(--paper);
    display:flex;align-items:center;justify-content:space-between;
    cursor:pointer;
    border-radius:var(--radius);
    min-height:56px;
  }
  .btn:active{transform:scale(.985);}
  .btn .arrow{font-family:'IBM Plex Mono',monospace;}
  .btn.secondary{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
    margin-top:10px;
  }
  .btn.ghost{
    background:transparent;color:var(--ink-soft);border:1px dashed var(--line);
    font-size:14px;padding:14px 16px;
  }
  .mode-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;letter-spacing:.1em;color:var(--muted);
    margin-top:10px;text-align:center;
  }

  /* ---------- game ---------- */
  #screen-game{padding-top:2px;}
  .progress-wrap{height:3px;background:var(--line);width:100%;flex:none;}
  .progress-bar{height:100%;background:var(--red);width:0%;transition:width .28s ease;}
  .game-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0 6px;
    flex:none;
  }
  .prompt{
    font-size:12px;letter-spacing:.1em;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;text-transform:uppercase;
  }
  .round-count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .battle{
    flex:1;
    display:flex;flex-direction:column;
    gap:10px;
    min-height:0;
    padding-bottom:6px;
  }
  .card{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;
    position:relative;
    cursor:pointer;
    padding:10px;
    min-height:0;
    -webkit-user-select:none;user-select:none;
    transition:transform .12s ease, background .12s ease;
  }
  .card:active{transform:scale(.98);background:#F2ECDD;}
  .card .emoji{font-size:min(15vw,74px);line-height:1;filter:grayscale(0);}
  .card .name{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;letter-spacing:.02em;
    text-align:center;
    color:var(--ink);
    max-width:80%;
  }
  .card.winner{background:var(--ink);}
  .card.winner .name{color:var(--paper);}
  .card.winner .emoji{transform:scale(1.08);}
  .card.loser{opacity:.28;}
  .vs-divider{
    flex:none;
    align-self:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--paper);
    background:var(--red);
    padding:5px 10px;
    letter-spacing:.08em;
    transform:rotate(-3deg);
    z-index:2;
    margin:-4px 0;
  }

  /* ---------- result ---------- */
  #screen-result{align-items:stretch;padding-top:2px;overflow-y:auto;}
  .receipt-wrap{
    flex:1;
    display:flex;flex-direction:column;
    padding:10px 0 4px;
  }
  #resultCanvas{
    width:100%;
    max-width:420px;
    margin:0 auto;
    display:block;
    aspect-ratio:4/5;
    border:1px solid var(--line);
  }
  .result-actions{margin-top:16px;}
  .share-row{display:flex;gap:8px;}
  .share-row .btn{flex:1;}
  .result-meta{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;color:var(--muted);
    text-align:center;
    line-height:1.6;
  }

  /* ---------- debug ---------- */
  #debugPanel{
    position:fixed;left:8px;bottom:8px;
    max-width:280px;max-height:40vh;overflow:auto;
    background:rgba(23,20,15,.92);color:#D9D0BC;
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    padding:8px;z-index:999;display:none;line-height:1.5;
    border-radius:2px;
  }

  /* ---------- accessibility / motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }
  button:focus-visible, .card:focus-visible{
    outline:2px solid var(--red);outline-offset:2px;
  }
  @media (min-width:480px){
    .title{font-size:64px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ================= INTRO ================= -->
  <section id="screen-intro" class="screen active">
    <div class="intro-top">
      <div class="brand">TOFU NIPPON</div>
      <div class="eyebrow"><span class="dot"></span>TOFU MASH</div>
    </div>
    <div class="intro-mid">
      <h1 class="title">WHAT<span>KIND OF</span><span class="accent">TOFU</span><span>ARE YOU?</span></h1>
      <p class="subcopy">12 instinct picks. no right answers. just tap the one that feels more tofu.</p>
      <div class="intro-preview" aria-hidden="true">
        <div class="preview-chip">🤍</div>
        <div class="preview-vs">VS</div>
        <div class="preview-chip">☁️</div>
      </div>
    </div>
    <div class="intro-bottom">
      <button class="btn" id="startBtn">
        <span id="startLabel">START — DAILY MASH</span>
        <span class="arrow">→</span>
      </button>
      <div class="mode-tag" id="modeTag">today's mash · same for everyone</div>
    </div>
  </section>

  <!-- ================= GAME ================= -->
  <section id="screen-game" class="screen">
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="game-head">
      <div class="prompt">which one is more tofu</div>
      <div class="round-count" id="roundCount">1/12</div>
    </div>
    <div class="battle">
      <button class="card" id="cardA" aria-label="Choose option A"></button>
      <div class="vs-divider">VS</div>
      <button class="card" id="cardB" aria-label="Choose option B"></button>
    </div>
  </section>

  <!-- ================= RESULT ================= -->
  <section id="screen-result" class="screen">
    <div class="eyebrow" style="margin-top:2px;"><span class="dot"></span>YOUR RESULT</div>
    <div class="receipt-wrap">
      <canvas id="resultCanvas" width="1080" height="1350"></canvas>
      <div class="result-actions">
        <div class="share-row">
          <button class="btn" id="shareBtn">SHARE ON X<span class="arrow">↗</span></button>
        </div>
        <button class="btn secondary" id="saveBtn">SAVE IMAGE</button>
        <button class="btn secondary" id="replayBtn">PLAY AGAIN</button>
        <button class="btn ghost" id="copyBtn">copy result text</button>
      </div>
      <div class="result-meta" id="resultMeta"></div>
    </div>
  </section>

</div>
<div id="debugPanel"></div>

<script>
(function(){
"use strict";

/* =========================================================
   0. ANALYTICS STUB
   ========================================================= */
window.__tofuEvents = [];
function track(name, data){
  var entry = {t:Date.now(), name:name, data:data||{}};
  window.__tofuEvents.push(entry);
  console.log("[tofu-mash]", name, data||{});
  renderDebug();
}

/* =========================================================
   1. CANDIDATE POOL + CATEGORY VECTORS
   axes: [softness, chaos, classic, absurdity, purity, unbothered, experimental]
   ========================================================= */
var VEC = {
  REAL_SOFT:        [2,0,2,0,1,1,0],
  REAL_FIRM:        [1,1,2,0,1,0,0],
  SOY_ADJ:          [1,0,1,0,1,1,1],
  SOFT_OBJ:         [2,0,0,1,0,1,1],
  HARD_OBJ:         [0,1,0,1,0,0,0],
  TEXTURE_CONFUSE:  [1,1,0,1,0,0,1],
  INTERNET_ABSURD:  [0,2,0,2,0,2,2]
};

function item(name, emoji, cat){ return {name:name, emoji:emoji, cat:cat}; }

var I = {
  silken:   item("Silken Tofu","🤍","REAL_SOFT"),
  kinugoshi:item("Kinugoshi Tofu","⬜","REAL_SOFT"),
  hiyayakko:item("Hiyayakko","🥢","REAL_SOFT"),
  eggtofu:  item("Egg Tofu","🥚","REAL_SOFT"),
  firm:     item("Firm Tofu","🔲","REAL_FIRM"),
  mapo:     item("Mapo Tofu","🌶️","REAL_FIRM"),
  agedashi: item("Agedashi Tofu","🍢","REAL_FIRM"),
  aburaage: item("Aburaage","🟧","REAL_FIRM"),
  yuba:     item("Yuba","🍜","SOY_ADJ"),
  okara:    item("Okara","🌾","SOY_ADJ"),
  soymilk:  item("Soy Milk","🥛","SOY_ADJ"),
  cloud:    item("Cloud","☁️","SOFT_OBJ"),
  pillow:   item("Pillow","🛏️","SOFT_OBJ"),
  marshmallow:item("Marshmallow","🍡","SOFT_OBJ"),
  jelly:    item("Jelly","🍮","SOFT_OBJ"),
  pannacotta:item("Panna Cotta","🍨","SOFT_OBJ"),
  memoryfoam:item("Memory Foam","🛌","SOFT_OBJ"),
  cottonball:item("Cotton Ball","🌫️","SOFT_OBJ"),
  mochi:    item("Mochi","⚪","SOFT_OBJ"),
  cottoncandy:item("Cotton Candy","🍬","SOFT_OBJ"),
  feather:  item("Feather","🪶","SOFT_OBJ"),
  balloon:  item("Balloon","🎈","SOFT_OBJ"),
  waterballoon:item("Water Balloon","💧","SOFT_OBJ"),
  bubblewrap:item("Bubble Wrap","💭","SOFT_OBJ"),
  gummybear:item("Gummy Bear","🐻","SOFT_OBJ"),
  bathbomb: item("Bath Bomb","🛁","SOFT_OBJ"),
  rubberduck:item("Rubber Duck","🦆","SOFT_OBJ"),
  icecream: item("Ice Cream","🍦","SOFT_OBJ"),
  custard:  item("Custard","🥣","SOFT_OBJ"),
  rock:     item("Rock","🪨","HARD_OBJ"),
  concrete: item("Concrete","🧱","HARD_OBJ"),
  ice:      item("Ice","🧊","HARD_OBJ"),
  brick:    item("Brick","🟥","HARD_OBJ"),
  cinderblock:item("Cinder Block","⬛","HARD_OBJ"),
  stone:    item("Stone","🗿","HARD_OBJ"),
  screenprotector:item("Screen Protector","📱","HARD_OBJ"),
  styrofoam:item("Styrofoam","📦","HARD_OBJ"),
  sponge:   item("Sponge","🧽","TEXTURE_CONFUSE"),
  cheese:   item("Cheese","🧀","TEXTURE_CONFUSE"),
  paper:    item("Paper","📄","TEXTURE_CONFUSE"),
  soap:     item("Soap","🧼","TEXTURE_CONFUSE"),
  fishcake: item("Fish Cake","🍥","TEXTURE_CONFUSE"),
  wetwipe:  item("Wet Wipe","🧻","TEXTURE_CONFUSE"),
  wifisignal:item("Wifi Signal","📶","INTERNET_ABSURD"),
  vibe:     item("The Vibe","✨","INTERNET_ABSURD"),
  groupchat:item("Group Chat","💬","INTERNET_ABSURD"),
  cursedmeme:item("Cursed Meme","🫠","INTERNET_ABSURD"),
  sundayscaries:item("Sunday Scaries","😮‍💨","INTERNET_ABSURD"),
  nostalgia:item("Nostalgia","📼","INTERNET_ABSURD"),
  silence:  item("Silence","🤐","INTERNET_ABSURD"),
  wifipassword:item("Wifi Password","🔐","INTERNET_ABSURD")
};

/* curated pairs — hand-picked for tension, not random pairing */
var PAIRS = [
  [I.silken, I.pannacotta],[I.hiyayakko, I.jelly],[I.yuba, I.paper],
  [I.firm, I.soap],[I.kinugoshi, I.custard],[I.mapo, I.cursedmeme],
  [I.agedashi, I.fishcake],[I.aburaage, I.cheese],[I.eggtofu, I.waterballoon],
  [I.okara, I.sundayscaries],[I.soymilk, I.wifisignal],[I.cloud, I.rock],
  [I.pillow, I.cinderblock],[I.marshmallow, I.ice],[I.sponge, I.silken],
  [I.memoryfoam, I.firm],[I.cottonball, I.concrete],[I.mochi, I.stone],
  [I.cottoncandy, I.brick],[I.feather, I.screenprotector],[I.balloon, I.styrofoam],
  [I.bubblewrap, I.kinugoshi],[I.gummybear, I.hiyayakko],[I.bathbomb, I.vibe],
  [I.rubberduck, I.groupchat],[I.icecream, I.nostalgia],[I.wifipassword, I.silence],
  [I.cheese, I.cloud],[I.wetwipe, I.yuba],[I.paper, I.marshmallow],
  [I.soap, I.bubblewrap],[I.fishcake, I.mochi],[I.rock, I.cursedmeme],
  [I.concrete, I.sundayscaries],[I.ice, I.vibe],[I.brick, I.silken],
  [I.stone, I.eggtofu],[I.cinderblock, I.cottoncandy],[I.styrofoam, I.pillow],
  [I.screenprotector, I.jelly],[I.custard, I.aburaage],[I.nostalgia, I.agedashi],
  [I.groupchat, I.mapo],[I.silence, I.cloud],[I.vibe, I.okara]
];

/* =========================================================
   2. RESULT TYPES — target profile per axis, 0-100 scale
   axes: [softness, chaos, classic, absurdity, purity, unbothered, experimental]
   ========================================================= */
var TYPES = [
  {id:"silent",   name:"SILENT TOFU",     tag:"soft. quiet. unbothered.",        v:[85,10,80,10,60,85,10]},
  {id:"softcore", name:"SOFTCORE TOFU",   tag:"gentle by choice.",               v:[75,40,50,45,40,50,45]},
  {id:"feral",    name:"FERAL TOFU",      tag:"soft outside. chaos inside.",     v:[80,80,30,50,20,30,40]},
  {id:"chaotic",  name:"CHAOTIC TOFU",    tag:"no plate can hold this.",         v:[30,90,10,80,10,40,60]},
  {id:"unbothered",name:"UNBOTHERED TOFU",tag:"still tofu. still calm.",         v:[50,15,55,20,40,90,20]},
  {id:"sad",      name:"SAD TOFU",        tag:"soft doesn't mean okay.",         v:[70,20,40,15,30,10,15]},
  {id:"cosmic",   name:"COSMIC TOFU",     tag:"beyond the fridge.",              v:[40,60,15,75,20,45,90]},
  {id:"crispy",   name:"CRISPY TOFU",     tag:"same tofu. new confidence.",      v:[25,45,85,30,50,35,25]},
  {id:"forbidden",name:"FORBIDDEN TOFU",  tag:"the internet warned you.",        v:[35,70,15,60,15,35,85]},
  {id:"emotional",name:"EMOTIONAL TOFU",  tag:"cries in the fridge sometimes.",  v:[80,25,45,20,80,20,30]},
  {id:"pure",     name:"PURE TOFU",       tag:"unseasoned. undefeated.",         v:[65,10,70,10,90,60,15]},
  {id:"ultimate", name:"ULTIMATE TOFU",   tag:"the last cube in the pack.",      v:[80,70,70,70,70,70,70]}
];

/* =========================================================
   3. SEEDED RNG
   ========================================================= */
function hashStr(s){ var h=1779033703^s.length;
  for(var i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  return function(){ h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); h^=h>>>16; return h>>>0; };
}
function mulberry32(a){
  return function(){ a|=0;a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function seededShuffle(arr, rng){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(rng()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp; }
  return a;
}
function todayStr(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* =========================================================
   4. GAME STATE
   ========================================================= */
var DEBUG = new URLSearchParams(location.search).get("debug")==="1";
document.getElementById("debugPanel").style.display = DEBUG ? "block":"none";

var state = { mode:"daily", rounds:[], round:0, scores:[0,0,0,0,0,0,0], busy:false };

function playedTodayAlready(){
  return localStorage.getItem("tofumash_daily_date") === todayStr();
}

function setupIntro(){
  var isRemix = playedTodayAlready();
  state.mode = isRemix ? "remix" : "daily";
  document.getElementById("startLabel").textContent = isRemix ? "PLAY AGAIN — REMIX MODE" : "START — DAILY MASH";
  document.getElementById("modeTag").textContent = isRemix
    ? "remix mash · a new combination, just for you"
    : "today's mash · same for everyone, today only";
}
setupIntro();

/* =========================================================
   5. SCREEN SWITCHING
   ========================================================= */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(function(s){ s.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
}

/* =========================================================
   6. GAME START / ROUND LOOP
   ========================================================= */
document.getElementById("startBtn").addEventListener("click", function(){
  var seedSrc = state.mode==="daily" ? ("tofu-"+todayStr()) : ("remix-"+Date.now()+"-"+Math.random());
  var seedFn = hashStr(seedSrc);
  var rng = mulberry32(seedFn());
  state.rounds = seededShuffle(PAIRS, rng).slice(0,12);
  state.round = 0;
  state.scores = [0,0,0,0,0,0,0];
  track(state.mode==="daily"?"daily_start":"remix_start", {seed:seedSrc});
  track("game_start", {mode:state.mode});
  showScreen("screen-game");
  renderRound();
});

function renderRound(){
  var pair = state.rounds[state.round];
  // randomize left/right per round for fairness, using Math.random (visual only, not seed-critical)
  var flip = Math.random() < 0.5;
  var a = flip ? pair[1] : pair[0];
  var b = flip ? pair[0] : pair[1];

  var elA = document.getElementById("cardA");
  var elB = document.getElementById("cardB");
  elA.innerHTML = '<div class="emoji" aria-hidden="true">'+a.emoji+'</div><div class="name">'+a.name.toUpperCase()+'</div>';
  elB.innerHTML = '<div class="emoji" aria-hidden="true">'+b.emoji+'</div><div class="name">'+b.name.toUpperCase()+'</div>';
  elA.setAttribute("aria-label","Choose "+a.name);
  elB.setAttribute("aria-label","Choose "+b.name);
  elA.className="card"; elB.className="card";
  elA.dataset.cat=a.cat; elB.dataset.cat=b.cat;

  document.getElementById("roundCount").textContent = (state.round+1)+"/12";
  document.getElementById("progressBar").style.width = ((state.round)/12*100)+"%";
  state.busy = false;
}

function handlePick(chosenEl, otherEl){
  if(state.busy) return;
  state.busy = true;
  var cat = chosenEl.dataset.cat;
  var vec = VEC[cat];
  for(var i=0;i<7;i++) state.scores[i]+=vec[i];

  chosenEl.classList.add("winner");
  otherEl.classList.add("loser");
  track("choice", {round:state.round+1, cat:cat});

  var delay = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 320;
  setTimeout(function(){
    state.round++;
    document.getElementById("progressBar").style.width = (state.round/12*100)+"%";
    track("round_complete", {round:state.round});
    if(state.round >= 12){
      finishGame();
    } else {
      renderRound();
    }
  }, delay);
}
document.getElementById("cardA").addEventListener("click", function(){
  handlePick(document.getElementById("cardA"), document.getElementById("cardB"));
});
document.getElementById("cardB").addEventListener("click", function(){
  handlePick(document.getElementById("cardB"), document.getElementById("cardA"));
});

/* =========================================================
   7. SCORING -> RESULT TYPE
   ========================================================= */
function computeResult(){
  var norm = state.scores.map(function(v){ return Math.min(100, Math.round(v/16*100)); });
  var allHigh = norm.every(function(v){ return v>=60; });
  var pool = TYPES.filter(function(t){ return t.id!=="ultimate" || allHigh; });
  var best=null, bestDist=Infinity;
  pool.forEach(function(t){
    var d=0;
    for(var i=0;i<7;i++){ var diff=t.v[i]-norm[i]; d+=diff*diff; }
    if(d<bestDist){ bestDist=d; best=t; }
  });
  return {type:best, norm:norm};
}

/* =========================================================
   8. RESULT RENDER (canvas receipt card)
   ========================================================= */
var lastResult = null;

function finishGame(){
  track("game_complete", {scores:state.scores});
  if(state.mode==="daily"){ localStorage.setItem("tofumash_daily_date", todayStr()); }
  lastResult = computeResult();
  drawCard(lastResult);
  var meta = document.getElementById("resultMeta");
  meta.textContent = "12 PICKS · " + (state.mode==="daily"?"DAILY MASH":"REMIX MASH") + " · " + todayStr();
  showScreen("screen-result");
  track("result_view", {type:lastResult.type.id});
  setupIntro(); // update button label for next visit to intro
}

function rarityLine(norm){
  // playful, non-statistical flavor text derived deterministically from scores
  var sum = norm.reduce(function(a,b){return a+b;},0);
  var pct = 3 + (sum % 27); // 3–29, deterministic-looking but purely flavor
  return "ROUGHLY 1 IN "+Math.max(4,Math.round(100/pct))+" TOFUS TODAY";
}

function drawCard(result){
  var c = document.getElementById("resultCanvas");
  var ctx = c.getContext("2d");
  var W=c.width, H=c.height;

  ctx.fillStyle="#FBF8F1"; ctx.fillRect(0,0,W,H);
  // dashed border
  ctx.strokeStyle="#D9D0BC"; ctx.lineWidth=3; ctx.setLineDash([10,10]);
  ctx.strokeRect(28,28,W-56,H-56);
  ctx.setLineDash([]);

  ctx.fillStyle="#8A8272";
  ctx.font="600 26px 'IBM Plex Mono', monospace";
  ctx.textAlign="left";
  ctx.fillText("TOFU NIPPON", 64, 108);
  ctx.textAlign="right";
  ctx.fillText(todayStr(), W-64, 108);

  ctx.strokeStyle="#D9D0BC"; ctx.lineWidth=2; ctx.setLineDash([6,10]);
  ctx.beginPath(); ctx.moveTo(64,140); ctx.lineTo(W-64,140); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle="#B8352A";
  ctx.font="600 30px 'IBM Plex Mono', monospace";
  ctx.textAlign="center";
  ctx.fillText("YOUR TOFU TYPE", W/2, 230);

  ctx.fillStyle="#17140F";
  ctx.font="700 92px 'Space Grotesk', sans-serif";
  wrapCenter(ctx, result.type.name, W/2, 350, W-140, 96);

  ctx.font="italic 500 34px 'Space Grotesk', sans-serif";
  ctx.fillStyle="#39352C";
  wrapCenter(ctx, result.type.tag, W/2, 560, W-200, 44);

  ctx.strokeStyle="#D9D0BC"; ctx.lineWidth=2; ctx.setLineDash([6,10]);
  ctx.beginPath(); ctx.moveTo(64, H-330); ctx.lineTo(W-64, H-330); ctx.stroke();
  ctx.setLineDash([]);

  var axes=["SOFT","CHAOS","CLASSIC","ABSURD","PURE","CALM","WEIRD"];
  ctx.font="500 22px 'IBM Plex Mono', monospace";
  ctx.textAlign="left";
  var barX=64, barW=W-128, rowH=34, top=H-300;
  axes.forEach(function(label,i){
    var y=top+i*rowH;
    ctx.fillStyle="#8A8272";
    ctx.fillText(label, barX, y+16);
    var bx=barX+150, bw=barW-150;
    ctx.fillStyle="#EFE8D8"; ctx.fillRect(bx,y,bw,14);
    ctx.fillStyle="#B8352A"; ctx.fillRect(bx,y,bw*(result.norm[i]/100),14);
  });

  ctx.fillStyle="#8A8272";
  ctx.font="500 22px 'IBM Plex Mono', monospace";
  ctx.textAlign="center";
  ctx.fillText(rarityLine(result.norm), W/2, H-70);
  ctx.fillStyle="#17140F";
  ctx.font="600 26px 'IBM Plex Mono', monospace";
  ctx.fillText("TOFU MASH", W/2, H-38);
}

function wrapCenter(ctx, text, cx, y, maxW, lineH){
  var words=text.split(" "), lines=[], cur="";
  words.forEach(function(w){
    var test=cur?cur+" "+w:w;
    if(ctx.measureText(test).width>maxW && cur){ lines.push(cur); cur=w; } else { cur=test; }
  });
  if(cur) lines.push(cur);
  var startY = y - (lines.length-1)*lineH/2;
  lines.forEach(function(line,i){ ctx.fillText(line, cx, startY+i*lineH); });
}

/* =========================================================
   9. SHARE / SAVE / REPLAY
   ========================================================= */
function shareText(){
  var t=lastResult.type;
  return "I got "+t.name+".\n\n"+t.tag+"\n\nWhat tofu are you?\n\nTOFU MASH ↓\nhttps://tofunippon.com/tofumash";
}

document.getElementById("shareBtn").addEventListener("click", function(){
  track("share_click", {type:lastResult.type.id});
  var url = "https://twitter.com/intent/tweet?text="+encodeURIComponent(shareText());
  window.open(url, "_blank", "noopener");
});

document.getElementById("saveBtn").addEventListener("click", function(){
  track("share_download", {type:lastResult.type.id});
  var link=document.createElement("a");
  link.download="tofu-mash-"+lastResult.type.id+".png";
  link.href=document.getElementById("resultCanvas").toDataURL("image/png");
  link.click();
});

document.getElementById("copyBtn").addEventListener("click", function(){
  track("result_copy", {type:lastResult.type.id});
  navigator.clipboard && navigator.clipboard.writeText(shareText()).catch(function(){});
  var btn=document.getElementById("copyBtn");
  var old=btn.textContent; btn.textContent="copied.";
  setTimeout(function(){ btn.textContent=old; }, 1200);
});

document.getElementById("replayBtn").addEventListener("click", function(){
  track("replay", {nextMode: playedTodayAlready()?"remix":"daily"});
  setupIntro();
  showScreen("screen-intro");
});

/* =========================================================
   10. KEYBOARD SUPPORT (arrow keys during battle)
   ========================================================= */
document.addEventListener("keydown", function(e){
  if(!document.getElementById("screen-game").classList.contains("active")) return;
  if(e.key==="ArrowLeft" || e.key==="1"){ document.getElementById("cardA").click(); }
  if(e.key==="ArrowRight" || e.key==="2"){ document.getElementById("cardB").click(); }
});

/* =========================================================
   11. DEBUG OVERLAY
   ========================================================= */
function renderDebug(){
  if(!DEBUG) return;
  var p=document.getElementById("debugPanel");
  var norm = state.scores.map(function(v){ return Math.min(100, Math.round(v/16*100)); });
  var log = window.__tofuEvents.slice(-8).map(function(e){ return e.name+" "+JSON.stringify(e.data); }).join("<br>");
  p.innerHTML = "<b>round:</b> "+state.round+"/12<br>"+
    "<b>scores:</b> "+state.scores.join(",")+"<br>"+
    "<b>norm:</b> "+norm.join(",")+"<br>"+
    "<b>type:</b> "+(lastResult?lastResult.type.id:"-")+"<br>"+
    "<hr style='border-color:#444'>"+log;
}
renderDebug();

})();
